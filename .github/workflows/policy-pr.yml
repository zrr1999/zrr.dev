name: Policy - PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-message:
    name: PR message
    if: github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event.pull_request.user.login != 'renovate[bot]'

      - name: Check PR title
        if: github.event.pull_request.user.login != 'renovate[bot]'
        uses: zendev-lab/zendev/actions/validate-title@7d8bcbf6134f62b7c7eaadb763f9a0d434717c44 # Shared message validation
        with:
          text: ${{ github.event.pull_request.title }}

      - name: Check PR body
        uses: zendev-lab/zendev/actions/validate-body@7d8bcbf6134f62b7c7eaadb763f9a0d434717c44 # Shared Markdown scanner
        with:
          body: ${{ github.event.pull_request.body }}
          template: .github/pull_request_template.md
