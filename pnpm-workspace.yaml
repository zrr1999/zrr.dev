packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  astro: "^7.1.1"
  # astro check 仍依赖 TS 6 的 sys API；TS 7 原生编译器尚不兼容（withastro/astro#17268）
  typescript: "6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.6"
  vite-plus: "0.2.6"
  vitest: "npm:@voidzero-dev/vite-plus-test@0.1.24"
  tailwindcss: "^4.3.3"
  "@tailwindcss/vite": "^4.3.3"
  "@tailwindcss/typography": "^0.5.20"
  "@astrojs/check": "^0.9.9"
  "@vite-pwa/astro": "^1.2.0"

minimumReleaseAgeExclude:
  - astro@7.1.1
  - "@lucide/astro@1.25.0"
  - miniflare@4.20260714.0
  - wrangler@4.112.0

overrides:
  astro: "catalog:"
  typescript: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  vitest: "catalog:"
  # 审计与兼容性钉死（勿随意升到未验证的 major）
  glob: "13.0.6"
  style-to-js: "2.0.2"
  yaml: "2.9.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    typescript: "*"
    vite: "*"
    vitest: "*"
